  Tari exposes its node and wallet functionality over gRPC (proto3, package tari.rpc).
  These are the canonical protobuf service definitions harvested verbatim from the
  minotari_app_grpc application in the tari-project/tari repository. The Base Node and
  Wallet gRPC servers are self-hosted (a developer/exchange runs their own node), so
  there is no single public REST/OpenAPI base URL — the proto files are the interface
  contract.
