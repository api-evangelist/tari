aid: tari
name: Tari
description: >-
  Tari is an open-source, proof-of-work blockchain protocol designed to be private by
  default (confidential transactions) and accessible to everyday users. Its Tari Universe
  application lets people mine XTM tokens by contributing compute, and the protocol has
  grown to hundreds of thousands of active miners. For developers, exchanges, and dApp
  builders, Tari exposes self-hosted Base Node and Wallet interfaces over gRPC (proto3,
  package tari.rpc): the Base Node service queries headers, blocks, mempool, network
  constants, block templates for miners, and PayRef payment-reference lookups, while the
  Wallet service handles balances, transfers, fee estimation, one-sided and atomic-swap
  transactions, transaction history, and a live transaction-event stream. A Layer-2
  (Ootle) adds smart-contract templates via the tari-cli. Official TypeScript SDKs
  (tari.js, typescript-bindings, wallet JSON-RPC client) and Rust crates support
  integration. Tari is backed by Canaan Partners, Multicoin Capital, Pantera Capital,
  and Trinity Ventures.
